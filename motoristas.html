<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Motoristas — Juanil</title>
<link rel="stylesheet" href="style.css">
<style>
  .motorista-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--azul-500); }
  .motorista-card.desligado { border-left-color: var(--cinza-400); opacity: 0.75; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-left: 8px; }
  .badge.ativo { background: var(--verde-bg); color: var(--verde); }
  .badge.desligado { background: #eee; color: var(--cinza-600); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--cinza-600); }
  .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 6px; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--azul-700); color: #fff; }
  .btn-secondary { background: var(--linha); color: var(--cinza-900); }
  .btn-danger { background: var(--vermelho); color: #fff; }
  .search-bar { margin: 16px 0; }
  .search-bar input { width: 100%; max-width: 400px; padding: 10px; border: 1px solid var(--linha); border-radius: 8px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .modal-content { background: #fff; padding: 24px; border-radius: 12px; max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div class="topbar">
  <img src="logo.jpg" alt="Juanil" class="brand-logo" style="height:36px; margin-right:12px;">
  <span class="brand-sub">Cadastro de Motoristas</span>
  <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
    <a href="index.html" style="color:#fff;">← Sinistros</a>
    <button id="btnNovo" class="btn btn-primary">+ Novo motorista</button>
  </div>
</div>

<div class="container" style="max-width:1000px; margin:24px auto; padding:0 16px;">
  <div class="search-bar">
    <input type="text" id="busca" placeholder="Buscar por nome, CPF ou CNH...">
  </div>
  <div id="listaMotoristas"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitulo">Novo motorista</h2>
    <form id="formMotorista">
      <div class="form-grid">
        <div class="field" style="grid-column:1/-1;"><label>Nome completo *</label><input type="text" name="nome" required></div>
        <div class="field"><label>CPF</label><input type="text" name="cpf"></div>
        <div class="field"><label>Data de nascimento</label><input type="date" name="nascimento"></div>
        <div class="field"><label>Nº CNH</label><input type="text" name="cnhNumero"></div>
        <div class="field"><label>Validade CNH</label><input type="date" name="cnhValidade"></div>
        <div class="field"><label>Categoria CNH</label><input type="text" name="categoria" placeholder="Ex.: AE, D, etc."></div>
        <div class="field"><label>Número do RG</label><input type="text" name="rg"></div>
        <div class="field"><label>Órgão emissor</label><input type="text" name="rgOrgao"></div>
        <div class="field"><label>Telefone / Celular</label><input type="text" name="telefone"></div>
        <div class="field"><label>Status</label>
          <select name="status">
            <option value="ativo">Ativo</option>
            <option value="desligado">Desligado</option>
          </select>
        </div>
      </div>
      <h3 style="margin:18px 0 8px;">Endereço</h3>
      <div class="form-grid">
        <div class="field"><label>CEP</label><input type="text" name="cep"></div>
        <div class="field" style="grid-column:1/-1;"><label>Logradouro</label><input type="text" name="logradouro"></div>
        <div class="field"><label>Número</label><input type="text" name="numero"></div>
        <div class="field"><label>Complemento</label><input type="text" name="complemento"></div>
        <div class="field"><label>Bairro</label><input type="text" name="bairro"></div>
        <div class="field"><label>Cidade</label><input type="text" name="cidade"></div>
        <div class="field"><label>UF</label><input type="text" name="uf" maxlength="2" style="text-transform:uppercase;"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnExcluir" style="display:none;">Excluir</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import {
  protegerPagina, getDocs, setDoc, updateDoc, deleteDoc, doc, collection,
  query, orderBy, serverTimestamp, auth, toast, escapeHtml, db
} from "./app-core.js";

const MOTORISTAS = collection(db, "motoristas");
let motoristas = [];
let editId = null;

protegerPagina(async () => {
  await carregar();
  document.getElementById("btnNovo").onclick = () => abrirModal();
  document.getElementById("btnCancelar").onclick = fecharModal;
  document.getElementById("busca").oninput = filtrar;
  document.getElementById("formMotorista").onsubmit = salvar;
  document.getElementById("btnExcluir").onclick = excluir;
});

async function carregar() {
  const snap = await getDocs(query(MOTORISTAS, orderBy("nome")));
  motoristas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render(motoristas);
}

function render(lista) {
  const el = document.getElementById("listaMotoristas");
  if (!lista.length) {
    el.innerHTML = "<p style='color:var(--cinza-600);'>Nenhum motorista cadastrado ainda.</p>";
    return;
  }
  el.innerHTML = lista.map(m => `
    <div class="motorista-card ${m.status === 'desligado' ? 'desligado' : ''}">
      <div>
        <strong>${escapeHtml(m.nome || "(sem nome)")}</strong>
        <span class="badge ${m.status === 'desligado' ? 'desligado' : 'ativo'}">${m.status === 'desligado' ? 'Desligado' : 'Ativo'}</span>
      </div>
      <div style="font-size:13px; color:var(--cinza-600); margin-top:6px;">
        CPF: ${escapeHtml(m.cpf || "—")} · CNH: ${escapeHtml(m.cnhNumero || "—")} ${m.categoria ? "(" + escapeHtml(m.categoria) + ")" : ""}
      </div>
      <div style="margin-top:10px;">
        <button class="btn btn-secondary" data-id="${m.id}">Editar</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll("button[data-id]").forEach(btn => {
    btn.onclick = () => {
      const m = motoristas.find(x => x.id === btn.dataset.id);
      if (m) abrirModal(m);
    };
  });
}

function filtrar() {
  const t = document.getElementById("busca").value.toLowerCase().trim();
  if (!t) { render(motoristas); return; }
  const f = motoristas.filter(m =>
    (m.nome || "").toLowerCase().includes(t) ||
    (m.cpf || "").replace(/\D/g, "").includes(t.replace(/\D/g, "")) ||
    (m.cnhNumero || "").includes(t)
  );
  render(f);
}

function abrirModal(m = null) {
  editId = m?.id || null;
  document.getElementById("modalTitulo").textContent = editId ? "Editar motorista" : "Novo motorista";
  document.getElementById("btnExcluir").style.display = editId ? "inline-block" : "none";
  const form = document.getElementById("formMotorista");
  form.reset();
  if (m) {
    form.nome.value = m.nome || "";
    form.cpf.value = m.cpf || "";
    form.nascimento.value = m.nascimento || "";
    form.cnhNumero.value = m.cnhNumero || "";
    form.cnhValidade.value = m.cnhValidade || "";
    form.categoria.value = m.categoria || "";
    form.rg.value = m.rg || "";
    form.rgOrgao.value = m.rgOrgao || "";
    form.telefone.value = m.telefone || "";
    form.status.value = m.status || "ativo";
    form.cep.value = m.endereco?.cep || "";
    form.logradouro.value = m.endereco?.logradouro || "";
    form.numero.value = m.endereco?.numero || "";
    form.complemento.value = m.endereco?.complemento || "";
    form.bairro.value = m.endereco?.bairro || "";
    form.cidade.value = m.endereco?.cidade || "";
    form.uf.value = m.endereco?.uf || "";
  }
  document.getElementById("modal").classList.add("open");
}

function fecharModal() {
  document.getElementById("modal").classList.remove("open");
  editId = null;
}

async function salvar(e) {
  e.preventDefault();
  const form = e.target;
  const data = {
    nome: form.nome.value.trim(),
    cpf: form.cpf.value.trim(),
    nascimento: form.nascimento.value || null,
    cnhNumero: form.cnhNumero.value.trim(),
    cnhValidade: form.cnhValidade.value || null,
    categoria: form.categoria.value.trim(),
    rg: form.rg.value.trim(),
    rgOrgao: form.rgOrgao.value.trim(),
    telefone: form.telefone.value.trim(),
    status: form.status.value,
    endereco: {
      cep: form.cep.value.trim(),
      logradouro: form.logradouro.value.trim(),
      numero: form.numero.value.trim(),
      complemento: form.complemento.value.trim(),
      bairro: form.bairro.value.trim(),
      cidade: form.cidade.value.trim(),
      uf: form.uf.value.trim().toUpperCase()
    },
    atualizadoEm: serverTimestamp(),
    atualizadoPor: auth.currentUser?.email || null
  };
  if (editId) {
    await updateDoc(doc(db, "motoristas", editId), data);
  } else {
    data.criadoEm = serverTimestamp();
    data.criadoPor = auth.currentUser?.email || null;
    await setDoc(doc(MOTORISTAS), data);
  }
  toast("Motorista salvo com sucesso.", "ok");
  fecharModal();
  await carregar();
}

async function excluir() {
  if (!editId || !confirm("Tem certeza que deseja excluir este motorista?")) return;
  await deleteDoc(doc(db, "motoristas", editId));
  toast("Motorista excluído.", "ok");
  fecharModal();
  await carregar();
}
</script>
</body>
</html>
