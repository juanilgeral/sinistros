<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      background: #bfe7ef;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #bfe7ef;
    }

    .collision-animation {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    .sky { fill: #bfe7ef; }
    .sun { fill: #ffe29a; }
    .cloud { fill: #effaff; opacity: .82; }
    .hill-back { fill: #a7d3c3; }
    .hill-front { fill: #76b49e; }
    .ground { fill: #90c67d; }
    .road { fill: #263545; }
    .road-edge { fill: #354758; }
    .lane-mark { fill: #ffd166; }
    .direction-arrow { fill: #9aaebe; opacity: .55; }

    .vehicle { transform-box: fill-box; transform-origin: center; }
    .truck-body { fill: #da5c3b; stroke: #842f28; stroke-width: 4; }
    .truck-cab { fill: #e77d45; stroke: #842f28; stroke-width: 4; }
    .truck-window { fill: #b8e2eb; stroke: #31536b; stroke-width: 3; }
    .vehicle-trim { fill: #f7b35a; }
    .wheel { fill: #19232d; stroke: #778593; stroke-width: 4; }
    .hub { fill: #dbe6eb; }
    .headlight { fill: #ffe48a; }
    .tail-light { fill: #ff735c; }
    .car-body { fill: #4f74d8; stroke: #263c8b; stroke-width: 4; }
    .car-window { fill: #b8e2eb; stroke: #263c8b; stroke-width: 3; }
    .car-stripe { fill: #f7d85a; }

    .truck,
    .car,
    .impact-flash,
    .smoke,
    .debris,
    .direction-arrow {
      animation-play-state: paused;
    }

    .is-running .truck { animation: truck-hit 6.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    .is-running .car { animation: car-approach 6.8s cubic-bezier(.45, 0, .55, 1) infinite; }
    .is-running .impact-flash { animation: flash 6.8s linear infinite; }
    .is-running .smoke { animation: smoke 6.8s ease-out infinite; }
    .is-running .debris { animation: debris 6.8s ease-out infinite; }
    .is-running .direction-arrow { animation: road-flow 2.2s linear infinite; }

    @keyframes car-approach {
      0%, 5% { transform: translateX(-285px); }
      48% { transform: translateX(240px); }
      59% { transform: translateX(425px); }
      62% { transform: translateX(468px); }
      66% { transform: translateX(438px) rotate(-1deg); }
      72%, 100% { transform: translateX(462px) rotate(0deg); }
    }

    @keyframes truck-hit {
      0%, 58% { transform: translateX(0); }
      62% { transform: translateX(14px) rotate(.4deg); }
      66% { transform: translateX(-7px) rotate(-.2deg); }
      72%, 100% { transform: translateX(9px); }
    }

    @keyframes flash {
      0%, 59% { opacity: 0; transform: scale(.2); }
      61% { opacity: 1; transform: scale(1.25); }
      65% { opacity: .55; transform: scale(1.02); }
      69%, 100% { opacity: 0; transform: scale(.8); }
    }

    @keyframes smoke {
      0%, 60% { opacity: 0; transform: translate(0, 0) scale(.3); }
      64% { opacity: .75; transform: translate(0, -8px) scale(.85); }
      73% { opacity: .45; transform: translate(16px, -40px) scale(1.35); }
      88%, 100% { opacity: 0; transform: translate(42px, -74px) scale(1.9); }
    }

    @keyframes debris {
      0%, 60% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      63% { opacity: 1; }
      75% { opacity: .8; transform: translate(34px, -53px) rotate(160deg); }
      100% { opacity: 0; transform: translate(72px, 22px) rotate(330deg); }
    }

    @keyframes road-flow {
      from { transform: translateX(-45px); }
      to { transform: translateX(120px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-running .truck,
      .is-running .car,
      .is-running .impact-flash,
      .is-running .smoke,
      .is-running .debris,
      .is-running .direction-arrow {
        animation-duration: .01ms;
        animation-iteration-count: 1;
      }
    }
  </style>
</head>
<body>

    <g transform="translate(60 325)">

        <circle class="wheel" cx="62" cy="92" r="22"/><circle class="hub" cx="62" cy="92" r="8"/>
        <circle class="wheel" cx="169" cy="92" r="22"/><circle class="hub" cx="169" cy="92" r="8"/>

    </g>

    <g transform="translate(612 330)">
      <g class="impact-flash">

    <g transform="translate(645 318)">

    <g transform="translate(612 338)">
      <g class="debris">

  </svg>
</body>
</html>
