<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sinistros Juanil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="logo.jpg" alt="Juanil" style="height:40px;display:block;margin-bottom:14px;border-radius:5px;">
    <h1>Registros Internos de Colisões</h1>
    <p>Juanil Transportes Rodoviários — acesso restrito à equipe.</p>
    <div class="login-error" id="loginError">E-mail ou senha inválidos.</div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="btnEntrar">Entrar</button>
    </form>
  </div>
</div>
<script type="module">
  import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./app-core.js";
  onAuthStateChanged(auth, (user) => { if (user) location.href = "index.html"; });
  const form = document.getElementById("loginForm");
  const erro = document.getElementById("loginError");
  const btn = document.getElementById("btnEntrar");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.style.display = "none";
    btn.textContent = "Entrando...";
    btn.disabled = true;
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("senha").value
      );
      location.href = "index.html";
    } catch (err) {
      erro.textContent = "Não foi possível entrar. Confira o e-mail e a senha.";
      erro.style.display = "block";
      btn.textContent = "Entrar";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
