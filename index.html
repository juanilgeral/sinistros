<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinistros — Juanil Transportes Rodoviários</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">JUANIL <span class="tag">SINISTROS</span></div>
  <div class="user">
    <span id="userEmail"></span>
    <button id="btnSair">Sair</button>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="busca" placeholder="Buscar por protocolo, placa, nome do condutor ou terceiro...">
    </div>
    <div class="filters" id="filtros">
      <button class="chip active" data-status="todos">Todos</button>
      <button class="chip" data-status="aberto">Aberto</button>
      <button class="chip" data-status="juridico">Com o jurídico</button>
      <button class="chip" data-status="concluido">Concluído</button>
    </div>
    <a href="form.html" class="btn btn-primary">+ Novo Sinistro</a>
  </div>

  <div class="grid-list" id="lista">
    <!-- preenchido via JS -->
  </div>

  <div class="empty-state" id="vazio" style="display:none;">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M9 16h6M9 8h6M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>
    <h3>Nenhum processo encontrado</h3>
    <p>Ajuste a busca ou cadastre um novo sinistro.</p>
  </div>
</div>

<script type="module">
  import { auth, signOut, protegerPagina, getDocs, query, orderBy, SINISTROS_COL, statusBadge, fmtData } from "./app-core.js";

  let todos = [];
  let statusAtivo = "todos";

  protegerPagina((user) => {
    document.getElementById("userEmail").textContent = user.email;
    carregar();
  });

  document.getElementById("btnSair").addEventListener("click", () => signOut(auth));

  async function carregar() {
    const q = query(SINISTROS_COL, orderBy("criadoEm", "desc"));
    const snap = await getDocs(q);
    todos = [];
    snap.forEach((d) => todos.push({ id: d.id, ...d.data() }));
    render();
  }

  function render() {
    const termo = document.getElementById("busca").value.trim().toLowerCase();
    const lista = document.getElementById("lista");
    const vazio = document.getElementById("vazio");

    let filtrados = todos.filter((s) => statusAtivo === "todos" || s.status === statusAtivo);

    if (termo) {
      filtrados = filtrados.filter((s) => {
        const alvo = [
          s.protocolo,
          s.veiculoJuanil?.placa, s.veiculoTerceiro?.placa,
          s.veiculoJuanil?.condutor?.nome,
          s.veiculoTerceiro?.proprietario?.nome
        ].filter(Boolean).join(" ").toLowerCase();
        return alvo.includes(termo);
      });
    }

    if (filtrados.length === 0) {
      lista.innerHTML = "";
      vazio.style.display = "block";
      return;
    }
    vazio.style.display = "none";

    lista.innerHTML = filtrados.map((s) => `
      <a class="card-processo" href="detalhe.html?id=${encodeURIComponent(s.id)}">
        <div class="stamp ${s.status === 'concluido' ? '' : s.status === 'aberto' ? 'vermelho' : 'laranja'}">
          <span class="dot"></span>${s.protocolo || s.id}
        </div>
        <div class="veiculos">
          <span class="placas">${s.veiculoJuanil?.placa || "—"} × ${s.veiculoTerceiro?.placa || "—"}</span>
          <span class="partes">${s.veiculoJuanil?.condutor?.nome || "motorista não informado"} — vs — ${s.veiculoTerceiro?.proprietario?.nome || "terceiro não informado"}</span>
        </div>
        <div class="data"><b>${fmtData(s.ocorrencia?.data) || "—"}</b>${s.ocorrencia?.especifique || s.ocorrencia?.localTipo || ""}</div>
        <div class="data">${(s.anexos || []).length} anexo(s)</div>
        ${statusBadge(s.status)}
      </a>
    `).join("");
  }

  document.getElementById("busca").addEventListener("input", render);
  document.getElementById("filtros").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    document.querySelectorAll("#filtros .chip").forEach((c) => c.classList.remove("active"));
    btn.classList.add("active");
    statusAtivo = btn.dataset.status;
    render();
  });
</script>
</body>
</html>
