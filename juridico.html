<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Sinistro — Acesso Jurídico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <img src="logo.jpg" alt="Juanil" class="brand-logo">
    <div class="brand-text">
      <span class="brand-title">Acesso do Jurídico</span>
      <span class="brand-sub">Juanil Transportes Rodoviários</span>
    </div>
  </div>
  <div class="user">
    <span style="font-size:12.5px;color:#B9C8DA;">Link de acesso direto — sem necessidade de login</span>
  </div>
</div>

<div class="wrap">
  <div class="toolbar no-print" id="toolbarAcoes" style="display:none;">
    <div id="stampHolder"></div>
    <div style="flex:1;"></div>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  </div>

  <div id="relatorio">
    <div class="report-card" id="carregando">
      <p class="rpt-narrative">Carregando processo...</p>
    </div>
  </div>
</div>

<script type="module">
  import { db, doc, getDoc, fmtData, fmtDinheiro, campoOuPendente, statusBadge, nomeLancador } from "./app-core.js";

  const params = new URLSearchParams(location.search);
  const token = params.get("t");

  async function carregar() {
    if (!token) {
      document.getElementById("relatorio").innerHTML = "<div class=\"report-card\"><p class=\"rpt-narrative\">Link inválido — falta o parâmetro de acesso.</p></div>";
      return;
    }
    let snap;
    try {
      snap = await getDoc(doc(db, "compartilhamentos", token));
    } catch (err) {
      console.error(err);
      document.getElementById("relatorio").innerHTML = "<div class=\"report-card\"><p class=\"rpt-narrative\">Não foi possível carregar este link. Ele pode ter sido revogado, ou o endereço está incompleto.</p></div>";
      return;
    }
    if (!snap.exists()) {
      document.getElementById("relatorio").innerHTML = "<div class=\"report-card\"><p class=\"rpt-narrative\">Este link não existe mais — pode ter sido revogado pela diretoria. Solicite um novo link.</p></div>";
      return;
    }
    const s = snap.data();
    const id = s.sinistroId || "";
    document.title = `Sinistro ${s.protocolo || id} — Acesso Jurídico`;
    document.getElementById("toolbarAcoes").style.display = "flex";
    document.getElementById("stampHolder").innerHTML = `
      <div class="stamp ${s.status === 'concluido' ? '' : s.status === 'aberto' ? 'vermelho' : 'laranja'}">
        <span class="dot"></span>${s.protocolo || id}
      </div>`;
    render(s, id, false);
  }
  carregar();

  function kv(label, valor, textoVazio) {
    return `<tr><td>${label}</td><td>${campoOuPendente(valor, textoVazio)}</td></tr>`;
  }

  function categoriaLabel(key) {
    return {
      ebrat: "E-BRAT (registro oficial do acidente)",
      dat: "CST — Comunicação de Sinistro de Trânsito (PRF)",
      cnhCondutor: "CNH do condutor",
      rg: "RG do proprietário",
      cpf: "CPF do proprietário",
      comprovanteResidencia: "Comprovante de residência",
      crlv: "CRLV atual do veículo",
      orcamentosArquivos: "Orçamentos formais (arquivos)",
      fotosDanos: "Fotos dos danos",
      outros: "Outros documentos"
    }[key] || key;
  }

  function render(s, id, souDiretoria) {
    const o = s.ocorrencia || {}, end = o.endereco || {}, cond = o.condicoes || {};
    const vj = s.veiculoJuanil || {}, emp = vj.empresa || {}, cJ = vj.condutor || {}, endCJ = cJ.endereco || {};
    const vt = s.veiculoTerceiro || {}, prop = vt.proprietario || {}, endProp = prop.endereco || {};
    const cst = s.cst || {}, cstCom = cst.comunicante || {}, cstEnd = cstCom.endereco || {}, cstRod = cst.rodovia || {};
    const det = s.detalhes || {};
    const testemunhas = s.testemunhas || [];
    const orcamentos = (s.orcamentos || []).map(o => ({ ...o, valorNum: parseFloat(o.valor) || 0 }));
    const menorValor = orcamentos.length ? Math.min(...orcamentos.map(o => o.valorNum)) : null;
    const orcamentosComCnpj = orcamentos.filter(o => o.cnpj?.trim());
    const menorValorValido = orcamentosComCnpj.length ? Math.min(...orcamentosComCnpj.map(o => o.valorNum)) : null;
    const temOrcamentoSemCnpjMaisBarato = orcamentos.some(o => !o.cnpj?.trim() && menorValorValido !== null && o.valorNum < menorValorValido);
    const comunicacoes = s.comunicacoes || [];
    const anexos = s.anexos || [];
    const categoriasComArquivo = new Set(anexos.map(a => a.categoria));
    const fotos = anexos.filter(a => a.categoria === "fotosDanos");
    const passos = s.proximosPassos || [];

    document.getElementById("relatorio").innerHTML = `
      <div class="report-card">
        <div class="report-head">
          <div>
            <div class="sub">Juanil Transportes Rodoviários</div>
            <h1>Relatório Interno de Sinistro</h1>
          </div>
        </div>
        <table class="meta-table">
          <tr><td>Protocolo</td><td><b>${s.protocolo || id}</b></td></tr>
          <tr><td>Referência</td><td>Caminhão ${campoOuPendente(vj.placa)} × Táxi/Veículo ${campoOuPendente(vt.placa)} — ${fmtData(o.data) || "data não informada"}</td></tr>
          <tr><td>Status do processo</td><td>${statusBadge(s.status)} ${escapeHtmlLocal(s.statusResumo || "")}</td></tr>
          <tr><td>Lançado por</td><td>${campoOuPendente(nomeLancador(s.criadoPorEmail), "Não informado (registro antigo)")}</td></tr>
          <tr><td>Estrutura do relatório</td><td>Organizado conforme os campos do formulário oficial E-BRAT (PMERJ)</td></tr>
        </table>

        <div class="rpt-section">
          <h2>1. Dados da Ocorrência</h2>
          <h3>Quando ocorreu o acidente</h3>
          <table class="kv-table">
            ${kv("Data", fmtData(o.data))}
            ${kv("Horário", o.horario)}
          </table>
          <h3>Onde ocorreu o acidente</h3>
          <table class="kv-table">
            ${kv("Local do acidente", o.localTipo)}
            ${kv("Especifique", o.especifique)}
          </table>
          <h3>Endereço</h3>
          <table class="kv-table">
            ${kv("CEP", end.cep, "Sem CEP / não informado")}
            ${kv("Logradouro", end.logradouro)}
            ${kv("Número", end.numero)}
            ${kv("Complemento", end.complemento)}
            ${kv("Bairro", end.bairro)}
            ${kv("Cidade", end.cidade)}
            ${kv("UF", end.uf)}
            ${kv("Ponto de referência", end.pontoReferencia)}
          </table>
          <h3>Condições do local</h3>
          <table class="kv-table">
            ${kv("Visibilidade", cond.visibilidade)}
            ${kv("Condições da pista", cond.pista)}
            ${kv("Sinalização", cond.sinalizacao)}
            ${kv("Tipo de acidente", o.tipoAcidente)}
          </table>
          ${o.dinamica ? `<p class="rpt-narrative" style="margin-top:10px;"><b>Dinâmica:</b> ${escapeHtmlLocal(o.dinamica)}</p>` : ""}
        </div>

        <div class="rpt-section">
          <h2>2. Veículo Principal — Frota Juanil (Empresa)</h2>
          <h3>Dados do veículo</h3>
          <table class="kv-table">
            ${kv("Placa", vj.placa)}
            ${kv("Marca/Modelo", vj.marcaModelo)}
            ${kv("Tipo do veículo", vj.tipo)}
            ${kv("Cor predominante", vj.cor)}
            ${kv("UF", vj.uf)}
            ${kv("Ano de fabricação", vj.anoFab)}
            ${kv("Ano do modelo", vj.anoModelo)}
            ${kv("Nº do chassi", vj.chassi)}
            ${kv("RENAVAM", vj.renavam)}
            ${kv("O veículo é da empresa?", vj.daEmpresa === "sim" ? "Sim" : vj.daEmpresa === "nao" ? "Não" : "")}
          </table>
          <h3>Dados da empresa</h3>
          <table class="kv-table">
            ${kv("Razão social", emp.razaoSocial)}
            ${kv("CNPJ", emp.cnpj)}
            ${kv("CEP", emp.cep)}
            ${kv("Logradouro", emp.logradouro)}
            ${kv("Número", emp.numero)}
            ${kv("Complemento", emp.complemento)}
            ${kv("Bairro", emp.bairro)}
            ${kv("Cidade", emp.cidade)}
            ${kv("UF", emp.uf)}
          </table>
          <h3>Dados do condutor</h3>
          <table class="kv-table">
            ${kv("Nome", cJ.nome)}
            ${kv("CPF", cJ.cpf)}
            ${kv("Data de nascimento", fmtData(cJ.nascimento))}
            ${kv("Nº CNH", cJ.cnhNumero)}
            ${kv("Validade", fmtData(cJ.cnhValidade))}
            ${kv("RG / órgão emissor", cJ.rg)}
            ${kv("Categoria", cJ.categoria)}
          </table>
          <h3>Endereço do condutor</h3>
          <table class="kv-table">
            ${kv("CEP", endCJ.cep)}
            ${kv("Logradouro", endCJ.logradouro)}
            ${kv("Número", endCJ.numero)}
            ${kv("Complemento", endCJ.complemento)}
            ${kv("Bairro", endCJ.bairro)}
            ${kv("Cidade", endCJ.cidade)}
            ${kv("UF", endCJ.uf)}
          </table>
          <h3>Danos</h3>
          <p class="rpt-narrative">${campoOuPendente(vj.danos, "Não informado")}</p>
        </div>

        <div class="rpt-section">
          <h2>3. Veículo de Terceiro</h2>
          <h3>Dados do veículo</h3>
          <table class="kv-table">
            ${kv("Placa", vt.placa)}
            ${kv("Marca/Modelo", vt.marcaModelo)}
            ${kv("Tipo do veículo", vt.tipo)}
            ${kv("Cor predominante", vt.cor)}
            ${kv("UF", vt.uf)}
            ${kv("Ano de fabricação", vt.anoFab)}
            ${kv("Ano do modelo", vt.anoModelo)}
            ${kv("Nº do chassi", vt.chassi)}
            ${kv("RENAVAM", vt.renavam)}
            ${kv("O veículo é da empresa?", vt.daEmpresa === "sim" ? "Sim" : vt.daEmpresa === "nao" ? "Não" : "")}
          </table>
          <h3>Dados do proprietário</h3>
          <table class="kv-table">
            ${kv("Nome", prop.nome)}
            ${kv("CPF", prop.cpf)}
            ${kv("Data de nascimento", fmtData(prop.nascimento))}
            ${kv("O proprietário é o condutor?", s.veiculoTerceiro?.proprietarioEhCondutor === "sim" ? "Sim" : s.veiculoTerceiro?.proprietarioEhCondutor === "nao" ? "Não" : "")}
            ${kv("Nº CNH", prop.cnhNumero)}
            ${kv("Validade", fmtData(prop.cnhValidade))}
            ${kv("RG / órgão emissor", prop.rg)}
          </table>
          <h3>Endereço do proprietário</h3>
          <table class="kv-table">
            ${kv("CEP", endProp.cep)}
            ${kv("Logradouro", endProp.logradouro)}
            ${kv("Número", endProp.numero)}
            ${kv("Complemento", endProp.complemento)}
            ${kv("Bairro", endProp.bairro)}
            ${kv("Cidade", endProp.cidade)}
            ${kv("UF", endProp.uf)}
          </table>
          ${vt.condutor?.nome ? `
          <h3>Dados do condutor (quando não é o proprietário)</h3>
          <table class="kv-table">
            ${kv("Nome", vt.condutor.nome)}
            ${kv("CPF", vt.condutor.cpf)}
            ${kv("Data de nascimento", fmtData(vt.condutor.nascimento))}
            ${kv("Nº CNH", vt.condutor.cnhNumero)}
            ${kv("Validade", fmtData(vt.condutor.cnhValidade))}
            ${kv("Endereço", vt.condutor.enderecoResumo)}
          </table>` : ""}
          <h3>Danos</h3>
          <p class="rpt-narrative">${campoOuPendente(vt.danos, "Não informado")}</p>
        </div>

        <div class="rpt-section">
          <h2>4. Testemunhas</h2>
          ${s.semTestemunhas || testemunhas.length === 0
            ? `<p class="rpt-narrative">Não houve testemunhas no local do acidente.</p>`
            : `<table class="kv-table">${testemunhas.map((t, i) => `
                <tr><td>Testemunha ${i + 1}</td><td>${escapeHtmlLocal(t.nome || "")} ${t.cpf ? "— CPF " + escapeHtmlLocal(t.cpf) : ""} ${t.celular ? "— " + escapeHtmlLocal(t.celular) : ""}</td></tr>
              `).join("")}</table>`}
        </div>

        <div class="rpt-section">
          <h2>5. Detalhes do Acidente</h2>
          <table class="kv-table">
            ${kv("Data que ocorreu o sinistro", fmtData(det.data) || fmtData(o.data))}
            ${kv("Local", det.local || o.especifique)}
            ${kv("Hora que ocorreu o sinistro", det.hora || o.horario)}
            ${kv("CNH do condutor", det.cnhCondutor || cJ.cnhNumero)}
          </table>
          <h3>Relato de como ocorreu o sinistro</h3>
          <p class="rpt-narrative">${campoOuPendente(det.relato, "Relato ainda não registrado.")}</p>
          ${det.autoriaRelato ? `<p class="rpt-note">${escapeHtmlLocal(det.autoriaRelato)}</p>` : ""}
          ${det.complementar ? `<h3>Descrição complementar do processo</h3><p class="rpt-narrative">${escapeHtmlLocal(det.complementar)}</p>` : ""}
        </div>

        <div class="rpt-section">
          <h2>6. Documentação Recebida</h2>
          <table class="kv-table" style="margin-bottom:10px;">
            ${kv("Protocolo E-BRAT do terceiro", s.documentacao?.ebratTerceiro)}
            ${kv("Protocolo E-BRAT da Juanil", s.documentacao?.ebratJuanil)}
            ${kv("Protocolo CST (PRF)", s.documentacao?.datProtocolo)}
          </table>
          <table class="doc-table">
            <tr><th>Documento</th><th>Status</th></tr>
            ${["ebrat","dat","cnhCondutor","rg","cpf","comprovanteResidencia","crlv","orcamentosArquivos","fotosDanos"].map((k) => `
              <tr><td>${categoriaLabel(k)}</td><td class="${categoriasComArquivo.has(k) ? "status-recebido" : "status-pendente"}">${categoriasComArquivo.has(k) ? "Recebido" : "Pendente"}</td></tr>
            `).join("")}
          </table>
        </div>

        <div class="rpt-section">
          <h2>7. Orçamentos de Reparo — Comparativo</h2>
          ${orcamentos.length ? `
          <table class="doc-table">
            <tr><th>Oficina</th><th>CNPJ</th><th>Data</th><th>Valor</th></tr>
            ${orcamentos.map(o => `
              <tr class="${o.valorNum === menorValorValido && o.cnpj?.trim() ? "orc-menor" : ""}">
                <td>${escapeHtmlLocal(o.oficina || "")}</td>
                <td>${o.cnpj?.trim() ? escapeHtmlLocal(o.cnpj) : '<span class="pend">⚠ sem CNPJ — não conforme</span>'}</td>
                <td>${fmtData(o.dataIso)}</td>
                <td>${fmtDinheiro(o.valorNum)}</td>
              </tr>`).join("")}
          </table>
          <p class="rpt-narrative" style="margin-top:8px;">
            ${menorValorValido !== null ? `<b>Menor orçamento com CNPJ válido: ${fmtDinheiro(menorValorValido)}</b>` : `<span class="pend">Nenhum orçamento com CNPJ informado ainda.</span>`}
            ${temOrcamentoSemCnpjMaisBarato ? `<br><span class="pend">Há orçamento(s) sem CNPJ com valor menor — regularizar antes de considerar na decisão final.</span>` : ""}
          </p>
          ` : `<p class="rpt-narrative">Nenhum orçamento cadastrado ainda.</p>`}

          ${comunicacoes.length ? `
          <h3>Comunicações recebidas</h3>
          ${comunicacoes.map(c => `
            <p class="rpt-narrative" style="margin-bottom:4px;"><b>${fmtData(c.dataIso)}${c.remetente ? " — " + escapeHtmlLocal(c.remetente) : ""}:</b></p>
            <p class="rpt-narrative" style="font-style:italic;border-left:3px solid #E3E7ED;padding-left:10px;margin-bottom:14px;">"${escapeHtmlLocal(c.texto)}"</p>
          `).join("")}
          ` : ""}
        </div>

        <div class="rpt-section">
          <h2>8. Status do Processo e Próximos Passos</h2>
          ${passos.length ? `<ul class="rpt-narrative">${passos.map(p => `<li>${escapeHtmlLocal(p)}</li>`).join("")}</ul>` : `<p class="rpt-narrative">Nenhum próximo passo cadastrado.</p>`}
        </div>

        <div class="rpt-section">
          <h2>Parecer da Diretoria</h2>
          ${s.compartilhamentoJuridico?.token ? `<p class="rpt-note" style="margin-bottom:10px;">📨 Encaminhado ao jurídico${s.compartilhamentoJuridico?.criadoPorEmail ? " por " + escapeHtmlLocal(nomeLancador(s.compartilhamentoJuridico.criadoPorEmail)) : ""}.</p>` : ""}
          ${souDiretoria ? `
            <textarea id="campoParecerDiretoria" class="modelo-email-textarea" style="min-height:110px;" placeholder="Registre aqui a posição do jurídico e o andamento do processo, conforme for evoluindo.">${escapeHtmlLocal(s.parecerDiretoria?.texto || "")}</textarea>
            <div class="modal-actions" style="justify-content:flex-start;margin-top:10px;">
              <button type="button" class="btn btn-primary btn-sm" id="btnSalvarParecer">Salvar parecer</button>
            </div>
            ${s.parecerDiretoria?.atualizadoPorEmail ? `<p class="rpt-note" style="margin-top:8px;">Última atualização por ${escapeHtmlLocal(nomeLancador(s.parecerDiretoria.atualizadoPorEmail))}.</p>` : ""}
          ` : `
            <p class="rpt-narrative">${campoOuPendente(s.parecerDiretoria?.texto, "A diretoria ainda não registrou um parecer para este processo.")}</p>
            ${s.parecerDiretoria?.atualizadoPorEmail ? `<p class="rpt-note">Última atualização por ${escapeHtmlLocal(nomeLancador(s.parecerDiretoria.atualizadoPorEmail))}.</p>` : ""}
          `}
        </div>

        ${s.documentacao?.aplicaDat ? `
        <div class="rpt-section">
          <h2>9. CST — Comunicação de Sinistro de Trânsito (PRF)</h2>
          <h3>Comunicante</h3>
          <table class="kv-table">
            ${kv("Relação com o veículo principal", ({condutor:"Condutor",corretor:"Corretor",proprietario:"Proprietário",passageiro:"Passageiro",condutorProprietario:"Condutor e Proprietário",terceiroAtingido:"Terceiro Atingido"})[cstCom.relacao] || cstCom.relacao)}
            ${kv("Estrangeiro", cstCom.estrangeiro ? "Sim" : "Não")}
            ${kv("Nome", cstCom.nome)}
            ${kv("CPF", cstCom.cpf)}
            ${kv("Profissão", cstCom.profissao)}
            ${kv("Sexo", cstCom.sexo === "feminino" ? "Feminino" : cstCom.sexo === "masculino" ? "Masculino" : cstCom.sexo)}
            ${kv("Nascimento", fmtData(cstCom.nascimento))}
            ${kv("E-mail", cstCom.email)}
            ${kv("Celular", cstCom.celular)}
            ${kv("Endereço", [cstEnd.logradouro, cstEnd.numero, cstEnd.bairro, cstEnd.cidade, cstEnd.uf].filter(Boolean).join(", "))}
          </table>
          <h3>Localização na rodovia federal</h3>
          <table class="kv-table">
            ${kv("UF / Cidade", [cstRod.uf, cstRod.cidade].filter(Boolean).join(" / "))}
            ${kv("BR / KM", [cstRod.br ? "BR-"+cstRod.br : "", cstRod.km ? "Km "+cstRod.km : ""].filter(Boolean).join(" — "))}
            ${kv("Trecho", cstRod.trecho)}
          </table>
          <h3>Condições e tipo de sinistro</h3>
          <table class="kv-table">
            ${kv("Condições da via", cst.condicoesVia)}
            ${kv("Sinalização", cst.sinalizacao)}
            ${kv("Traçado da via", cst.tracadoVia)}
            ${kv("Condições meteorológicas", cst.condicoesMeteorologicas)}
            ${kv("Tipo de sinistro", ({danosEventuais:"Danos Eventuais",atropelamentoAnimal:"Atropelamento de Animal",colisaoFrontal:"Colisão Frontal",colisaoLateral:"Colisão Lateral",colisaoTraseira:"Colisão Traseira",colisaoTransversal:"Colisão Transversal",colisaoObjetoEstatico:"Colisão com Objeto Estático",colisaoObjetoMovel:"Colisão com Objeto Móvel",derramamentoCarga:"Derramamento de Carga",saidaPista:"Saída de Pista",tombamento:"Tombamento",engavetamento:"Engavetamento"})[cst.tipoSinistro] || cst.tipoSinistro)}
          </table>
          <p class="rpt-note">Dados de apoio pro preenchimento em comunicante.prf.gov.br — não substituem a comunicação oficial.</p>
        </div>` : ""}

        ${fotos.length ? `
        <div class="rpt-section">
          <h2>Anexo — Fotos dos Danos</h2>
          <div class="photo-grid">
            ${fotos.map((f, i) => `<figure><img src="${f.url}" alt="Foto ${i+1}"><figcaption>Foto ${i+1} — ${escapeHtmlLocal(f.nome)}</figcaption></figure>`).join("")}
          </div>
        </div>` : ""}

        ${anexos.length ? `
        <div class="rpt-section no-print">
          <h2>Todos os anexos</h2>
          <table class="doc-table">
            <tr><th>Categoria</th><th>Arquivo</th></tr>
            ${anexos.map(a => `<tr><td>${categoriaLabel(a.categoria)}</td><td><a href="${a.url}" target="_blank" rel="noopener">${escapeHtmlLocal(a.nome)}</a></td></tr>`).join("")}
          </table>
        </div>` : ""}
      </div>
    `;
  }

  function escapeHtmlLocal(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

</script>
</body>
</html>
